<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header th:fragment="header" class="topbar">
    <div class="brand">
        <a th:href="@{/}">TQDUY SHOP (Ví dụ 1)</a>
    </div>
    <nav class="topbar-nav" style="display:flex; gap:16px; margin-left: 24px; flex:1;">
        <a th:href="@{/}" style="color:#dbeafe;">Trang chủ</a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/dashboard}" style="color:#dbeafe;">Dashboard Admin</a>
    </nav>
    <div class="account" sec:authorize="isAuthenticated()">
        <span style="color:#e2e8f0; margin-right: 12px;">
            Xin chào: <b sec:authentication="name" style="color:#60a5fa;">user</b>
        </span>
        <form th:action="@{/logout}" method="post" style="display:inline">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button class="link-button" type="submit" style="background:#ef4444; padding:6px 12px; border-radius:6px; color:white; border:none; cursor:pointer;">
                Đăng xuất
            </button>
        </form>
    </div>
    <div th:unless="${#authorization.expression('isAuthenticated()')}">
        <a th:href="@{/login}" class="btn primary small" style="color:white; text-decoration:none;">Đăng nhập</a>
    </div>
</header>
</body>
</html>
