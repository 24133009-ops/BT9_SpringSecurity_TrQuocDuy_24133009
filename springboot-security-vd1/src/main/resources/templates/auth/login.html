<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head('Đăng nhập')}"></head>
<body class="auth-page">
<div class="auth-card">
    <div style="text-align:center; margin-bottom: 20px;">
        <h1 style="color:#1d4ed8; margin:0;">TQDUY SHOP</h1>
        <p style="color:#64748b; margin-top:4px;">Ví dụ 1: Login cơ bản với Spring Security</p>
    </div>
    <h2>Đăng nhập</h2>
    <div class="alert error" th:if="${param.error}">Email hoặc mật khẩu không đúng.</div>
    <div class="alert success" th:if="${param.logout}">Bạn đã đăng xuất thành công.</div>

    <form th:action="@{/login}" method="post">
        <label>Email</label>
        <input type="email" name="email" required autofocus placeholder="nhập email: trungnh@hcmute.edu.vn">
        
        <label>Mật khẩu</label>
        <input type="password" name="password" required placeholder="nhập mật khẩu: 123456">
        
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button class="btn primary full" type="submit" style="margin-top: 15px;">Đăng nhập</button>
    </form>

    <div style="margin-top: 20px; padding: 12px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 13px; color: #475569;">
        <strong>Tài khoản thử nghiệm có sẵn:</strong><br>
        • Admin: <code>trungnh@hcmute.edu.vn</code> / pass: <code>123456</code><br>
        • User: <code>user01@gmail.com</code> / pass: <code>123456</code>
    </div>
</div>
</body>
</html>
