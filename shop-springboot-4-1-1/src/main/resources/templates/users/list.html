<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head('Users')}"></head>
<body>
<div th:replace="~{layouts/layout :: page(~{::main})}">
<main>
    <h1>Quản lý Users</h1>
    <div th:if="${success}" class="alert success" th:text="${success}"></div>
    
    <div class="toolbar">
        <form th:action="@{/users}" method="get">
            <input name="keyword" th:value="${keyword}" placeholder="Tìm username, email, họ tên...">
            <input type="hidden" name="size" th:value="${size}">
            <button class="button" type="submit">Tìm kiếm</button>
        </form>
        <a class="button" th:href="@{/users/create}">+ Thêm User</a>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Username</th>
                <th>Email</th>
                <th>Họ tên</th>
                <th>Role</th>
                <th>Enabled</th>
                <th>Products</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="u : ${users.content}">
                <td th:text="${u.id}"></td>
                <td th:text="${u.username}"></td>
                <td th:text="${u.email}"></td>
                <td th:text="${u.fullName}"></td>
                <td>
                    <span th:text="${u.roleName}" style="padding: 2px 6px; border-radius: 4px; font-size: 12px; font-weight: 600; background: #e0e7ff; color: #3730a3;"></span>
                </td>
                <td>
                    <span th:text="${u.enabled ? 'ACTIVE' : 'INACTIVE'}" 
                          th:style="${u.enabled ? 'color: #16a34a; font-weight: 600;' : 'color: #dc2626; font-weight: 600;'}"></span>
                </td>
                <td>
                    <span th:text="${u.productCount}" style="font-weight: 600; color: #2563eb;"></span>
                </td>
                <td class="actions">
                    <a th:href="@{/users/edit/{id}(id=${u.id})}" class="button small">Edit</a>
                    <form th:action="@{/users/delete/{id}(id=${u.id})}" method="post" onsubmit="return confirm('Xác nhận xóa user này?')">
                        <button class="danger-link" type="submit">Delete</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${users.empty}">
                <td colspan="8" style="text-align: center; color: #64748b; padding: 20px;">Không có dữ liệu.</td>
            </tr>
        </tbody>
    </table>

    <div class="pagination" th:if="${users.totalPages > 1}">
        <a th:if="${users.hasPrevious()}" th:href="@{/users(page=${users.number - 1},size=${size},keyword=${keyword})}">«</a>
        <span th:each="i : ${#numbers.sequence(0, users.totalPages > 0 ? users.totalPages - 1 : 0)}">
            <a th:classappend="${i == users.number ? 'active' : ''}" th:href="@{/users(page=${i},size=${size},keyword=${keyword})}" th:text="${i+1}"></a>
        </span>
        <a th:if="${users.hasNext()}" th:href="@{/users(page=${users.number + 1},size=${size},keyword=${keyword})}">»</a>
    </div>
</main>
</div>
</body>
</html>
