<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head('Products')}"></head>
<body>
<div th:replace="~{layouts/layout :: page(~{::main})}">
<main>
    <h1>Quản lý Products</h1>
    <div th:if="${success}" class="alert success" th:text="${success}"></div>

    <div class="toolbar">
        <form th:action="@{/products}" method="get">
            <input name="keyword" th:value="${keyword}" placeholder="Tìm tên sản phẩm, mô tả...">
            <input type="hidden" name="size" th:value="${size}">
            <button class="button" type="submit">Tìm kiếm</button>
        </form>
        <a class="button" th:href="@{/products/create}">+ Thêm Product</a>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Ảnh</th>
                <th>Tên sản phẩm</th>
                <th>Giá</th>
                <th>Người tạo</th>
                <th>Thao tác</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="p : ${products.content}">
                <td th:text="${p.id}"></td>
                <td>
                    <img th:if="${p.imageUrl != null}"
                         th:src="${#strings.contains(p.imageUrl, '|') ? #strings.substringBefore(p.imageUrl, '|') : p.imageUrl}"
                         class="thumb" alt="Product Image">
                    <span th:unless="${p.imageUrl != null}" style="color:#94a3b8; font-style:italic;">No image</span>
                </td>
                <td th:text="${p.name}" style="font-weight:600;"></td>
                <td th:text="${#numbers.formatDecimal(p.price, 0, 'COMMA', 2, 'POINT')} + ' VNĐ'" style="color:#059669; font-weight:600;"></td>
                <td th:text="${p.username}"></td>
                <td class="actions">
                    <a th:href="@{/products/edit/{id}(id=${p.id})}" class="button small">Edit</a>
                    <form th:action="@{/products/delete/{id}(id=${p.id})}" method="post" onsubmit="return confirm('Xác nhận xóa product này?')">
                        <button class="danger-link" type="submit">Delete</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${products.empty}">
                <td colspan="6" style="text-align:center; color:#64748b; padding:20px;">Không có dữ liệu.</td>
            </tr>
        </tbody>
    </table>

    <div class="pagination" th:if="${products.totalPages > 1}">
        <a th:if="${products.hasPrevious()}" th:href="@{/products(page=${products.number - 1},size=${size},keyword=${keyword})}">«</a>
        <span th:each="i : ${#numbers.sequence(0, products.totalPages > 0 ? products.totalPages - 1 : 0)}">
            <a th:classappend="${i == products.number ? 'active' : ''}" th:href="@{/products(page=${i},size=${size},keyword=${keyword})}" th:text="${i+1}"></a>
        </span>
        <a th:if="${products.hasNext()}" th:href="@{/products(page=${products.number + 1},size=${size},keyword=${keyword})}">»</a>
    </div>
</main>
</div>
</body>
</html>
