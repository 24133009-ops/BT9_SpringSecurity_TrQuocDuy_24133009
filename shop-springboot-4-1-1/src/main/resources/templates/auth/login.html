<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head('Đăng nhập')}"></head>
<body>
<div class="auth-page">
    <div class="auth-card">
        <h1>Đăng nhập</h1>
        <div th:if="${param.error}" class="alert error">Username/password không đúng hoặc tài khoản chưa được xác thực qua OTP.</div>
        <div th:if="${param.logout}" class="alert success">Bạn đã đăng xuất thành công.</div>
        <div th:if="${success}" class="alert success" th:text="${success}"></div>

        <form th:action="@{/login}" method="post">
            <label>Username hoặc Email</label>
            <input name="username" placeholder="Nhập username hoặc email" required autofocus>
            
            <label>Password</label>
            <input type="password" name="password" placeholder="Nhập mật khẩu" required>

            <button class="button full" type="submit" style="margin-top: 15px;">Đăng nhập</button>
        </form>

        <div style="margin-top: 15px; display: flex; justify-content: space-between;">
            <a th:href="@{/register}">Tạo tài khoản mới</a>
            <a th:href="@{/forgot-password}">Quên mật khẩu?</a>
        </div>

        <div style="margin-top: 20px; padding: 12px; background: #f8fafc; border-radius: 8px; font-size: 13px; color: #475569; border: 1px solid #e2e8f0;">
            <strong>Tài khoản mẫu:</strong><br>
            • Admin: <code>admin</code> / pass: <code>123456</code><br>
            • User: <code>trungnh</code> / pass: <code>123456</code>
        </div>
    </div>
</div>
</body>
</html>
