<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head('Quên mật khẩu')}"></head>
<body>
<div class="auth-page">
    <div class="auth-card">
        <form th:action="@{/forgot-password}" th:object="${forgotPasswordDTO}" method="post">
            <h1>Quên mật khẩu</h1>
            <div th:if="${#fields.hasGlobalErrors()}" class="alert error">
                <p th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p>
            </div>
            <label>Email đăng ký</label>
            <input type="email" th:field="*{email}" placeholder="Nhập địa chỉ email..." required>
            <button class="button full" style="margin-top: 15px;">Gửi mã OTP</button>
        </form>
        <p style="text-align: center; margin-top: 15px;">
            <a th:href="@{/login}">Quay lại Đăng nhập</a>
        </p>
    </div>
</div>
</body>
</html>
