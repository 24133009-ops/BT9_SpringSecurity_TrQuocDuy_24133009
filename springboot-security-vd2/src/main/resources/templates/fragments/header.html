<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="header" class="topbar">
    <nav style="display:flex; align-items:center; width:100%; justify-content:space-between;">
        <div style="display:flex; align-items:center; gap:24px;">
            <a th:href="@{/}" class="brand">UTEShop (Ví dụ 2)</a>
            <a th:href="@{/}" style="color:#dbeafe; text-decoration:none; font-weight:500;">Trang chủ</a>
            <a th:if="${#authorization.expression('hasRole(''ADMIN'')')}" th:href="@{/admin}" style="color:#fde047; text-decoration:none; font-weight:600;">Khu vực Admin</a>
        </div>

        <div th:if="${#authorization.expression('isAuthenticated()')}" class="account" style="display:flex; align-items:center; gap:14px;">
            <!-- Avatar -->
            <img th:src="${#authentication.principal.images != null and !#strings.isEmpty(#authentication.principal.images) ? #authentication.principal.images : '/images/avatar-default.png'}"
                 alt="Avatar"
                 width="42"
                 height="42"
                 style="border-radius:50%; object-fit:cover; border:2px solid #60a5fa; box-shadow:0 2px 8px rgba(0,0,0,0.2);">

            <!-- Full Name -->
            <span th:text="${#authentication.principal.fullName}" style="font-weight:700; color:#fff; font-size:15px;">
                Nguyễn Văn A
            </span>

            <!-- Username -->
            <span th:text="'(' + ${#authentication.principal.username} + ')'" style="color:#93c5fd; font-size:13px;">
                (user01)
            </span>

            <!-- Email -->
            <span th:text="${#authentication.principal.email}" style="color:#cbd5e1; font-size:13px; background:#1e293b; padding:3px 8px; border-radius:4px;">
                email@gmail.com
            </span>

            <!-- Role Badge -->
            <span th:text="${#authentication.principal.role}" style="background:#2563eb; color:white; padding:3px 8px; border-radius:4px; font-size:12px; font-weight:600;">
                ROLE_USER
            </span>

            <!-- Logout -->
            <form th:action="@{/logout}" method="post" style="display:inline; margin:0;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="btn small danger" style="background:#dc2626; color:white; border:none; border-radius:6px; cursor:pointer; padding:6px 12px; font-weight:600;">
                    Đăng xuất
                </button>
            </form>
        </div>

        <div th:unless="${#authorization.expression('isAuthenticated()')}">
            <a th:href="@{/login}" class="btn primary small" style="color:white; text-decoration:none;">Đăng nhập</a>
        </div>
    </nav>
</header>
</body>
</html>
