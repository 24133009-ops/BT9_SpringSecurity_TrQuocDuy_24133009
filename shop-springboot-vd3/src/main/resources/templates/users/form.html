<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head(${mode == 'create' ? 'Thêm User' : 'Sửa User'})}"></head>
<body>
<div th:replace="~{layouts/layout :: page(~{::main})}">
<main>
    <div class="form-card">
        <form th:object="${userDTO}" method="post" accept-charset="UTF-8"
              th:action="${mode == 'create'} ? @{/users/create} : @{/users/edit/{id}(id=${userDTO.id})}">
            
            <h1 th:text="${mode == 'create' ? 'Thêm User mới' : 'Cập nhật thông tin User'}"></h1>
            
            <label>Username</label>
            <input th:field="*{username}" placeholder="Nhập username...">
            <small class="error-text" th:errors="*{username}"></small>

            <label>Email</label>
            <input type="email" th:field="*{email}" placeholder="Nhập email...">
            <small class="error-text" th:errors="*{email}"></small>

            <label>Họ tên</label>
            <input th:field="*{fullName}" placeholder="Nhập họ và tên...">
            <small class="error-text" th:errors="*{fullName}"></small>

            <label>Role</label>
            <select th:field="*{roleName}">
                <option value="ROLE_USER">USER</option>
                <option value="ROLE_ADMIN">ADMIN</option>
            </select>

            <div style="margin: 15px 0;">
                <label style="display:flex; align-items:center; gap:8px; cursor:pointer;">
                    <input type="checkbox" th:field="*{enabled}" style="width:auto; margin:0;"> Kích hoạt (Enabled)
                </label>
            </div>

            <div style="margin-top: 20px;">
                <button class="button" type="submit">Lưu thông tin</button>
                <a class="button secondary" th:href="@{/users}" style="margin-left: 10px;">Hủy</a>
            </div>
        </form>
        <p th:if="${mode == 'create'}" class="note" style="margin-top: 20px;">
            Mật khẩu mặc định của user mới do Admin tạo là: <b>123456</b>.
        </p>
    </div>
</main>
</div>
</body>
</html>
