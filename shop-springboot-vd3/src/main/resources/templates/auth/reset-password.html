<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head('Đặt lại mật khẩu')}"></head>
<body>
<div class="auth-page">
    <div class="auth-card">
        <form th:action="@{/reset-password}" th:object="${resetPasswordDTO}" method="post">
            <h1>Đặt lại mật khẩu</h1>
            <div th:if="${success}" class="alert success" th:text="${success}"></div>
            <div th:if="${#fields.hasGlobalErrors()}" class="alert error">
                <p th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p>
            </div>

            <label>Email</label>
            <input type="email" th:field="*{email}" required>

            <label>OTP 6 số</label>
            <input name="otp" maxlength="6" placeholder="Nhập mã OTP vừa nhận" required>

            <label>Mật khẩu mới</label>
            <input type="password" th:field="*{password}" placeholder="Mật khẩu mới tối thiểu 6 ký tự" required>

            <label>Xác nhận mật khẩu</label>
            <input type="password" th:field="*{confirmPassword}" placeholder="Nhập lại mật khẩu mới" required>

            <button class="button full" style="margin-top: 15px;">Đổi mật khẩu</button>
        </form>
        <p style="text-align: center; margin-top: 15px;">
            <a th:href="@{/login}">Quay lại Đăng nhập</a>
        </p>
    </div>
</div>
</body>
</html>
